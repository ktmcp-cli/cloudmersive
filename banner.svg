<svg xmlns="http://www.w3.org/2000/svg" width="800" height="120" viewBox="0 0 800 120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d2b2b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0a3d35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f4a3a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3dffc0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="120" rx="10" ry="10" fill="url(#bg)" />

  <!-- Subtle grid lines -->
  <line x1="0" y1="40" x2="800" y2="40" stroke="#1a4a3a" stroke-width="0.5" opacity="0.5" />
  <line x1="0" y1="80" x2="800" y2="80" stroke="#1a4a3a" stroke-width="0.5" opacity="0.5" />
  <line x1="200" y1="0" x2="200" y2="120" stroke="#1a4a3a" stroke-width="0.5" opacity="0.3" />
  <line x1="400" y1="0" x2="400" y2="120" stroke="#1a4a3a" stroke-width="0.5" opacity="0.3" />
  <line x1="600" y1="0" x2="600" y2="120" stroke="#1a4a3a" stroke-width="0.5" opacity="0.3" />

  <!-- OCR scan-line accent -->
  <rect x="30" y="20" width="4" height="80" rx="2" fill="#3dffc0" opacity="0.7" />
  <rect x="38" y="30" width="2" height="60" rx="1" fill="#3dffc0" opacity="0.4" />

  <!-- Main title -->
  <text
    x="60"
    y="70"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="42"
    font-weight="bold"
    letter-spacing="2"
    fill="url(#text-grad)"
  >cloudmersive</text>

  <!-- Subtitle -->
  <text
    x="62"
    y="95"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="14"
    fill="#5bc4a0"
    opacity="0.85"
    letter-spacing="1"
  >@ktmcp-cli/cloudmersive · OCR CLI</text>

  <!-- Right-side badge -->
  <rect x="680" y="38" width="96" height="28" rx="5" fill="#1a4a3a" stroke="#3dffc0" stroke-width="1" opacity="0.9" />
  <text
    x="728"
    y="57"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="12"
    fill="#3dffc0"
    text-anchor="middle"
    letter-spacing="1"
  >ktmcp-cli</text>
</svg>
